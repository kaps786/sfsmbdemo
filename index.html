<!--
  WEB-TO-LEAD — Wemed Energy
  ==========================
  Palette: #004071 (primario) / bianco (secondario), coerente con la
  Visualforce page dei preventivi (WemedQuotePDF).

  STATO: oid già valorizzato con l'Organization Id reale di smbdemo2
  (00DHu00000uSpSkMAK). I nomi dei campi standard (first_name, last_name,
  company, email, phone, country, city, state, description, lead_source)
  sono quelli fissi documentati da Salesforce per Web-to-Lead; il campo
  custom usa il suo API Name reale (Partita_IVA__c). Il file è quindi
  già pronto all'uso, a condizione che:

  COSA MANCA DA FARE IN SETUP (una tantum, 1 click):
  1. Setup → Feature Settings → Lead Capture → Web-to-Lead → attivare
     il toggle "Web-to-Lead" (senza questo, l'endpoint rifiuta le
     submission anche con oid e nomi campo corretti)
  2. Pubblica questa pagina in hosting esterno (o come Salesforce Site/
     pagina pubblica Experience Cloud) per ottenere un URL pubblico
  3. Genera il QR code puntato a quell'URL per la fiera

  LOGO: al momento punta all'URL pubblico del logo su wemedenergy.it.
  Se il sito blocca l'hotlinking (l'immagine non si carica), sostituisci
  il src con una copia del logo caricata nel tuo hosting.
-->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wemed Energy — Richiedi una consulenza</title>
<style>
  :root {
    --wemed-primary: #004071;
    --wemed-secondary: #ffffff;
    --wemed-tint: #eef4f8;
    --wemed-border: #cdd9e0;
    --wemed-text: #1a1a1a;
    --wemed-font: 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--wemed-font);
    background: var(--wemed-tint);
    margin: 0;
    padding: 0;
    color: var(--wemed-text);
  }
  .wemed-form-wrapper {
    max-width: 480px;
    margin: 40px auto;
    background: var(--wemed-secondary);
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0,64,113,0.15);
    overflow: hidden;
  }
  .wemed-header {
    background: var(--wemed-primary);
    padding: 22px 32px;
    text-align: center;
  }
  .wemed-header img {
    max-height: 44px;
    max-width: 200px;
  }
  .wemed-header h1 {
    color: var(--wemed-secondary);
    font-size: 17px;
    margin: 14px 0 0;
    font-weight: 600;
  }
  .wemed-body {
    padding: 26px 32px 30px;
  }
  .wemed-body p.intro {
    font-size: 13px;
    color: #4a5a62;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .wemed-field {
    margin-bottom: 14px;
  }
  .wemed-field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--wemed-primary);
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .wemed-field input,
  .wemed-field select,
  .wemed-field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--wemed-border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    color: var(--wemed-text);
  }
  .wemed-field textarea { resize: vertical; min-height: 60px; }
  .wemed-row { display: flex; gap: 12px; }
  .wemed-row .wemed-field { flex: 1; }
  .wemed-submit {
    width: 100%;
    background: var(--wemed-primary);
    color: var(--wemed-secondary);
    border: none;
    padding: 14px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .wemed-submit:hover { opacity: 0.9; }
  .wemed-disclaimer {
    font-size: 10.5px;
    color: #8a97a0;
    margin-top: 14px;
    text-align: center;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="wemed-form-wrapper">
  <div class="wemed-header">
    <img src="logo1.png" alt="Wemed Energy">
    <h1>Richiedi una consulenza tecnica</h1>
  </div>

  <div class="wemed-body">
    <p class="intro">Lasciaci i tuoi dati: un nostro tecnico ti ricontatterà per valutare il potenziale di recupero energetico della tua rete idrica.</p>

    <!-- ⬇⬇ FORM WEB-TO-LEAD — sostituire "oid" con quello reale generato dal wizard Salesforce ⬇⬇ -->
    <form action="https://webto.salesforce.com/servlet/servlet.WebToLead" method="POST">
      <input type="hidden" name="oid" value="00DHu00000uSpSk">
      <input type="hidden" name="retURL" value="https://www.wemedenergy.it/">
      <!--<input type="hidden" name="lead_source" value="Trade Show">-->
      <input type="hidden"  id="lead_source" name="lead_source" value="Web" />

      <div class="wemed-row">
        <div class="wemed-field">
          <label for="first_name">Nome*</label>
          <input id="first_name" maxlength="40" name="first_name" required>
        </div>
        <div class="wemed-field">
          <label for="last_name">Cognome*</label>
          <input id="last_name" maxlength="80" name="last_name" required>
        </div>
      </div>

      <div class="wemed-field">
        <label for="company">Azienda*</label>
        <input id="company" maxlength="255" name="company" required>
      </div>

      <div class="wemed-row">
        <div class="wemed-field">
          <label for="email">Email*</label>
          <input id="email" maxlength="80" name="email" type="email" required>
        </div>
        <div class="wemed-field">
          <label for="phone">Telefono</label>
          <input id="phone" maxlength="40" name="phone">
        </div>
      </div>

      <div class="wemed-field">
        <label for="partita_iva">Partita IVA</label>
        <input id="00NHu00002OMz3p" maxlength="20" name="00NHu00002OMz3p">
      </div>

      <div class="wemed-row">
        <div class="wemed-field">
          <label for="country">Nazione</label>
          <input id="country" maxlength="80" name="country">
        </div>
        <div class="wemed-field">
          <label for="city">Città</label>
          <input id="city" maxlength="40" name="city">
        </div>
        <div class="wemed-field">
          <label for="state">Provincia</label>
          <input id="state" maxlength="20" name="state">
        </div>
      </div>

      <div class="wemed-field">
        <label for="description">Note</label>
        <textarea id="description" maxlength="32000" name="description"></textarea>
      </div>

      <button type="submit" class="wemed-submit">Invia richiesta</button>
      <p class="wemed-disclaimer">Inviando il form acconsenti al trattamento dei dati secondo la Privacy Policy Wemed Energy.</p>
    </form>
  </div>
</div>

</body>
</html>
